"scope/front":
    - any:
          - changed-files:
                - any-glob-to-any-file:
                      - UniQUE-Front/**/*
"scope/api":
    - any:
          - changed-files:
                - any-glob-to-any-file:
                      - UniQUE-API/**/*
"scope/auth":
    - any:
          - changed-files:
                - any-glob-to-any-file:
                      - UniQUE-Auth/**/*
"scope/mail":
    - any:
          - changed-files:
                - any-glob-to-any-file:
                      - UniQUE-MailServer/**/*
"scope/discord":
    - any:
          - changed-files:
                - any-glob-to-any-file:
                      - UniQUE-Discord/**/*
"scope/deploy":
    - any:
          - changed-files:
                - any-glob-to-any-file:
                      - kustomizations/**/*
"kind/dev":
    - any:
          - changed-files:
                - any-glob-to-any-file:
                      - .github/**/*
                      - .vscode/**/*
                      - docker-compose.yml
                      - renovate.json
