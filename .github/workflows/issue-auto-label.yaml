# [front]　などでscope/frontなどをつける

name: Issue Auto Label

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to label"
        required: true
        type: number

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Get issue details
        id: get_issue
        if: github.event_name == 'workflow_dispatch'
        run: |
          ISSUE_TITLE=$(gh issue view ${{ github.event.inputs.issue_number }} --json title -q .title)
          echo "::set-output name=title::$ISSUE_TITLE"
          echo "::set-output name=number::${{ github.event.inputs.issue_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get issue details from event
        id: get_issue_event
        if: github.event_name == 'issues'
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          echo "::set-output name=title::$ISSUE_TITLE"
          echo "::set-output name=number::${{ github.event.issue.number }}"

      - name: Read the issue-labeler.yaml file
        id: read_labeler
        run: |
          # Use GITHUB_OUTPUT to safely set multiline output
          echo "labeler<<EOF" >> "$GITHUB_OUTPUT"
          cat .github/issue-labeler.yaml >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Determine labels based on the issue content
        id: determine_labels
        run: |
          ISSUE_TITLE="${{ steps.get_issue.outputs.title }}${{ steps.get_issue_event.outputs.title }}"
          ISSUE_NUMBER="${{ steps.get_issue.outputs.number }}${{ steps.get_issue_event.outputs.number }}"
          LABELS=""
          LABELER_CONTENT="${{ steps.read_labeler.outputs.labeler }}"
          while IFS= read -r line; do
            echo "Processing line: $line" # デバッグ用の出力
            if [[ "$line" =~ ^\[(.+)\]: ]]; then
              echo "Matched line: $line" # デバッグ用の出力
              LABEL_KEY="${BASH_REMATCH[1]}"
              echo "Extracted label key: $LABEL_KEY" # デバッグ用の出力
              if [[ "$ISSUE_TITLE" == *"$LABEL_KEY"* ]]; then
                echo "Issue title contains label key: $LABEL_KEY" # デバッグ用の出力
                LABELS_PART=$(printf '%s\n' "$LABELER_CONTENT" | yq e ".[\"[${LABEL_KEY}]\"][]" -)
                if [ -n "$LABELS_PART" ]; then
                  LABELS+="$LABELS_PART"
                  LABELS+=" "
                fi
                echo "Labels: $LABELS"
              fi
            fi
          done <<< "$LABELER_CONTENT"
          echo "::set-output name=labels::$LABELS"
          echo "::set-output name=number::$ISSUE_NUMBER"

      - name: Add labels to the issue
        if: ${{ steps.determine_labels.outputs.labels != null }}
        run: |
          LABELS="${{ steps.determine_labels.outputs.labels }}"
          ISSUE_NUMBER="${{ steps.determine_labels.outputs.number }}"
          if [ -n "$LABELS" ]; then
            gh issue edit $ISSUE_NUMBER --add-label "$LABELS"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create comment file
        if: ${{ steps.determine_labels.outputs.labels != null }}
        run: |
          cat  << EOF > comment.md
          ## Issue Auto-Labeler
          Thanks for your contribution! The following labels have been automatically applied to this issue:
          EOF
          for label in ${{ steps.determine_labels.outputs.labels }}; do
            echo "- $label" >> comment.md
          done

      - name: Post comment on the issue
        if: ${{ steps.determine_labels.outputs.labels != null }}
        run: |
          gh issue comment ${{ steps.determine_labels.outputs.number }} --body-file comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
