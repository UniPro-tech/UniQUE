name: Issue labeler
on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  label-component:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read

    strategy:
      matrix:
        template:
          - bug_report.yaml
          - enhancement_request.yaml
          - feature_request.yaml

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Parse issue form
        uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/${{ matrix.template }}

      - name: Set labels based on component field
        uses: redhat-plumbers-in-action/advanced-issue-labeler@b80ae64e3e156e9c111b075bfa04b295d54e8e2e # v3
        with:
          issue-form: ${{ steps.issue-parser.outputs.jsonString }}
          template: ${{ matrix.template }}
          token: ${{ secrets.GITHUB_TOKEN }}
