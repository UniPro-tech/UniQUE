name: Containers and Helm chart

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: containers-and-chart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  containers:
    name: Container / ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: UniQUE-API
          - name: auth
            context: UniQUE-Auth
          - name: mail
            context: UniQUE-MailServer
          - name: front
            context: UniQUE-Front
          - name: db
            context: UniQUE-DB
          - name: discord
            context: UniQUE-Discord
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: image
        name: Resolve image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          echo "name=ghcr.io/${owner}/${repository}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=UniQUE ${{ matrix.name }}
            org.opencontainers.image.description=UniQUE ${{ matrix.name }} container image
            org.opencontainers.image.vendor=All-Japan Digital Creative Club UniProject
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: helm lint deploy/helm/unique
      - run: helm template unique deploy/helm/unique --namespace unique
      - run: helm lint deploy/helm/unique --values deploy/helm/unique/values-production.yaml
      - name: Verify release versions stay aligned
        shell: bash
        run: |
          manifest_version="$(jq -r '.["."]' .release-please-manifest.json)"
          chart_version="$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' deploy/helm/unique/Chart.yaml)"
          app_version="$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2; exit }' deploy/helm/unique/Chart.yaml)"
          if [[ "$manifest_version" != "$chart_version" || "$manifest_version" != "$app_version" ]]; then
            echo "Release versions are not aligned: manifest=$manifest_version chart=$chart_version app=$app_version" >&2
            exit 1
          fi

  publish-helm:
    name: Publish Helm chart
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [containers, helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - id: release
        name: Resolve chart version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must use vX.Y.Z semantic versioning." >&2
              exit 1
            fi
            app_version="$version"
          else
            version="0.0.0-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            app_version="sha-${GITHUB_SHA}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app-version=$app_version" >> "$GITHUB_OUTPUT"
          echo "registry=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"
      - name: Package chart
        run: |
          helm package deploy/helm/unique \
            --destination dist \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.app-version }}"
      - name: Sign in to Harbor
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish chart
        run: helm push "dist/unique-${{ steps.release.outputs.version }}.tgz" "${{ steps.release.outputs.registry }}"
