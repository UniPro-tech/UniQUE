name: Biome
on:
  push:
    paths:
      - "UniQUE-Front/**"
      - "!*.md"
      - "!.vscode/**"
      - "!.github/**"
      - ".github/workflows/biome.yaml"
    tags-ignore:
      - "api/v*"
      - "auth/v*"
      - "mail/v*"
      - "db/v*"
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: latest
      - name: Run Biome
        run: biome ci ./UniQUE-Front --config-path='./.config/biome.github.json'
