apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unique-front
spec:
  entryPoints:
    - websecure
  routes:
    # 内部APIパスへのアクセスをブロック（最優先）
    - kind: Rule
      match: Host(`api.uniproject.jp`) && PathPrefix(`/internal/`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      priority: 100
      services:
        - kind: Service
          name: internal-blocker
          port: 80
    - kind: Rule
      match: Host(`auth.uniproject.jp`) && PathPrefix(`/internal/`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      priority: 100
      services:
        - kind: Service
          name: internal-blocker
          port: 80
    # メインのAPIルート
    - kind: Rule
      match: Host(`api.uniproject.jp`) && PathPrefix(`/`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      priority: 10
      services:
        - kind: Service
          name: api
          passHostHeader: true
          port: 80
          responseForwarding:
            flushInterval: 1ms
          scheme: http
          sticky:
            cookie:
              httpOnly: true
              name: cookie
              secure: true
          strategy: wrr
          weight: 10
    - kind: Rule
      match: Host(`unique.uniproject.jp`) && PathPrefix(`/`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      priority: 1
      services:
        - kind: Service
          name: front
          passHostHeader: true
          port: 80
          responseForwarding:
            flushInterval: 1ms
          scheme: http
          sticky:
            cookie:
              httpOnly: true
              name: cookie
              secure: true
          strategy: wrr
          weight: 10
    - kind: Rule
      match: Host(`auth.uniproject.jp`) && PathPrefix(`/`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      priority: 1
      services:
        - kind: Service
          name: auth
          passHostHeader: true
          port: 80
          responseForwarding:
            flushInterval: 1ms
          scheme: http
          sticky:
            cookie:
              httpOnly: true
              name: cookie
              secure: true
          strategy: wrr
          weight: 10
  tls:
    certResolver: cf-prod
    domains:
      - main: api.uniproject.jp
      - main: auth.uniproject.jp
      - main: unique.uniproject.jp
