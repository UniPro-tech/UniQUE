apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: block-internal-filter
spec:
  directResponse:
    statusCode: 403
    contentType: text/plain
    body:
      type: Inline
      inline: "403 Forbidden: Access to /internal/ is blocked."
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
spec:
  parentRefs:
    - name: uniproject-jp-gateway
      namespace: infra-gateway
  hostnames:
    - "api.uniproject.jp"
  rules:
    # --- /internal/ へのアクセスを Envoy 自体が即座に 403 拒否 ---
    - matches:
        - path:
            type: PathPrefix
            value: /internal/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: block-internal-filter
    # --- メイン API ルート ---
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 80
      sessionPersistence:
        sessionName: cookie
        type: Cookie
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-route
spec:
  parentRefs:
    - name: uniproject-jp-gateway
      namespace: infra-gateway
  hostnames:
    - "auth.uniproject.jp"
  rules:
    # --- 最優先: /internal/ へのアクセス制御 ---
    - matches:
        - path:
            type: PathPrefix
            value: /internal/
      backendRefs:
        - name: internal-blocker
          port: 80
    # --- メイン Auth ルート ---
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: auth
          port: 80
      sessionPersistence:
        sessionName: cookie
        type: Cookie
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unique-front-route
spec:
  parentRefs:
    - name: uniproject-jp-gateway
      namespace: infra-gateway
  hostnames:
    - "unique.uniproject.jp"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: front
          port: 80
      sessionPersistence:
        sessionName: cookie
        type: Cookie
