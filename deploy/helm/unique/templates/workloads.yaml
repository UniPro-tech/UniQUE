apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    {{- include "unique.labels" . | nindent 4 }}
    app: mysql
spec:
  replicas: {{ .Values.database.replicaCount }}
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - { name: mysql, containerPort: 3306 }
          envFrom:
            - secretRef: { name: {{ .Values.database.existingSecret }} }
          resources: {{ toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - { name: mysql-storage, mountPath: /var/lib/mysql }
            - { name: mysql-conf, mountPath: /etc/mysql/conf.d, readOnly: true }
      volumes:
        - name: mysql-storage
          {{- if .Values.database.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "unique.mysqlClaim" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: mysql-conf
          configMap:
            name: mysql-conf
            items:
              - { key: my.conf, path: my.cnf }
{{- if .Values.internalBlocker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-blocker
  labels:
    {{- include "unique.labels" . | nindent 4 }}
    app: internal-blocker
spec:
  replicas: 1
  selector:
    matchLabels: { app: internal-blocker }
  template:
    metadata:
      labels: { app: internal-blocker }
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.internalBlocker.image.repository }}:{{ .Values.internalBlocker.image.tag }}"
          imagePullPolicy: {{ .Values.internalBlocker.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 80 }
          resources: {{ toYaml .Values.internalBlocker.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
      volumes:
        - name: config
          configMap: { name: internal-blocker-config }
{{- end }}
