apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "unique.labels" . | nindent 4 }}
    app: unique-api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 1
  selector:
    matchLabels: { app: unique-api }
  template:
    metadata:
      labels: { app: unique-api }
    spec:
      serviceAccountName: {{ include "unique.serviceAccountName" (dict "Values" .Values "Chart" .Chart "Release" .Release "component" "api") }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- include "unique.waitForMigration" . | nindent 6 }}
      containers:
        - name: unique-api
          image: "{{ .Values.api.image.repository }}:{{ include "unique.imageTag" (dict "tag" .Values.api.image.tag "Chart" .Chart) }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - secretRef: { name: {{ .Values.api.existingSecret }} }
          env:
            - { name: GIN_MODE, value: {{ .Values.api.ginMode | quote }} }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    {{- include "unique.labels" . | nindent 4 }}
    app: unique-auth
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.auth.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 1
  selector:
    matchLabels: { app: unique-auth }
  template:
    metadata:
      labels: { app: unique-auth }
    spec:
      serviceAccountName: {{ include "unique.serviceAccountName" (dict "Values" .Values "Chart" .Chart "Release" .Release "component" "auth") }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- include "unique.waitForMigration" . | nindent 6 }}
      containers:
        - name: unique-auth
          image: "{{ .Values.auth.image.repository }}:{{ include "unique.imageTag" (dict "tag" .Values.auth.image.tag "Chart" .Chart) }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: ENV, value: {{ .Values.auth.environment | quote }} }
          envFrom:
            - secretRef: { name: {{ .Values.auth.existingSecret }} }
          volumeMounts:
            - { name: auth-keys, mountPath: /app/keys }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources: {{ toYaml .Values.auth.resources | nindent 12 }}
      volumes:
        - name: auth-keys
          {{- if .Values.persistence.authKeys.enabled }}
          persistentVolumeClaim: { claimName: {{ include "unique.authKeysClaim" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-server
  labels:
    {{- include "unique.labels" . | nindent 4 }}
    app: unique-front
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.front.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 1
  selector:
    matchLabels: { app: unique-front }
  template:
    metadata:
      labels: { app: unique-front }
    spec:
      serviceAccountName: {{ include "unique.serviceAccountName" (dict "Values" .Values "Chart" .Chart "Release" .Release "component" "front") }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: unique-front
          image: "{{ .Values.front.image.repository }}:{{ include "unique.imageTag" (dict "tag" .Values.front.image.tag "Chart" .Chart) }}"
          imagePullPolicy: {{ .Values.front.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: NODE_OPTIONS, value: --max-old-space-size=4096 }
          envFrom:
            - secretRef: { name: {{ .Values.front.existingSecret }} }
          readinessProbe:
            httpGet: { path: /signin, port: http }
          volumeMounts:
            - { name: front-keys, mountPath: /app/keys }
          resources: {{ toYaml .Values.front.resources | nindent 12 }}
      volumes:
        - name: front-keys
          {{- if .Values.persistence.frontKeys.enabled }}
          persistentVolumeClaim: { claimName: {{ include "unique.frontKeysClaim" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
