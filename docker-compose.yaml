##
## UniQUE Local Development Stack
## Usage: docker compose up --build
##

name: unique

x-rustfs-environment: &rustfs-environment
  RUSTFS_ACCESS_KEY: admin
  RUSTFS_SECRET_KEY: mysecretpassword
  RUSTFS_BUCKET: my-bucket

services:
  # ──────────────────────────────────────────────
  # MySQL Database
  # ──────────────────────────────────────────────
  db:
    image: mysql:9.7
    container_name: unique-db
    environment:
      MYSQL_ROOT_PASSWORD: Rootpassword
      MYSQL_DATABASE: devdb
      MYSQL_USER: api
      MYSQL_PASSWORD: NewPass123
    volumes:
      - ./dev/mysql:/etc/mysql/conf.d
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-pRootpassword",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Database Migration (run-once)
  # ──────────────────────────────────────────────
  db-migrate:
    build:
      context: ./UniQUE-DB
      platforms:
        - linux/amd64
      dockerfile: Dockerfile.dev
    container_name: unique-db-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:Rootpassword@tcp(db:3306)/devdb?multiStatements=true"
      MAX_RETRIES: "60"
      SLEEP: "2"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Auth Server (OAuth2 / OpenID Connect)
  # Port 8000 → container 8080
  # ──────────────────────────────────────────────
  auth:
    build:
      context: ./UniQUE-Auth
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: unique-auth
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN:
        "root:Rootpassword@tcp(db:3306)/devdb?charset=utf8mb4&parseTime=True&lo\
        c=Local"
      CONFIG_APP_NAME: UniQUE
      CONFIG_FRONTEND_URL: "http://localhost:3000"
      CONFIG_ISSUER_URL: "http://localhost:8000"
      CONFIG_KEY_TYPE: RSA
      CONFIG_KEY_PUBLIC_PATH: /app/keys/public
      CONFIG_KEY_PRIVATE_PATH: /app/keys/private
      GIN_MODE: debug
      CONFIG_WEBAUTHN_RPID: "localhost"
      CONFIG_WEBAUTHN_RP_DISPLAY_NAME: "UniQUE Dev"
      CONFIG_WEBAUTHN_ORIGIN: "https://localhost:3000"
      CONFIG_WEBAUTHN_DEBUG: "true"
    volumes:
      - auth-keys:/app/keys
    ports:
      - "8000:8080"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Resource API Server
  # Port 8001 → container 8080
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./UniQUE-API
      dockerfile: ./Dockerfile
      platforms:
        - linux/amd64
    container_name: unique-api
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
    environment:
      DB_DSN:
        "root:Rootpassword@tcp(db:3306)/devdb?charset=utf8mb4&parseTime=True&lo\
        c=Local"
      CONFIG_APP_NAME: UniQUE
      CONFIG_FRONTEND_URL: "http://localhost:3000"
      CONFIG_ISSUER_URL: "http://localhost:8000"
      CONFIG_ISSUER_INTERNAL_URL: "http://auth:8080"
      CONFIG_EMAIL_SENDER_URL: "http://mailserver:8080"
      DISCORD_CLIENT_ID: "1437220613554176294"
      DISCORD_CLIENT_SECRET: "your-client-secret"
      DISCORD_GUILD_ID: "your-guild-id"
      DISCORD_BOT_TOKEN: "your-token-here"
      DISCORD_MEMBER_ROLE_ID: "your-member-role-id-here"
      GIN_MODE: debug
    ports:
      - "8001:8080"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Mail Server
  # Port 8002 → container 8080
  # ──────────────────────────────────────────────
  mailserver:
    build:
      context: ./UniQUE-MailServer
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: unique-mailserver
    environment:
      CONFIG_APP_NAME: UniQUE
      CONFIG_FRONTEND_URL: "http://localhost:3000"
      CONFIG_ISSUER_URL: "http://auth:8080"
      SMTP_HOST: unipro.sakura.ne.jp
      SMTP_PORT: "587"
      SMTP_USERNAME: "yuito@uniproject.jp"
      SMTP_PASSWORD: "ty_ttyy_11291129"
      SMTP_FROM: "yuito@uniproject.jp"
      SMTP_SECURE: "false"
      FROM_NAME: "デジタル創作サークルUniProject | UniQUE"
      COPYRIGHT_NAME: "All-Japan Digital Creative Club UniProject"
      GIN_MODE: debug
    ports:
      - "8002:8080"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Object Storage
  # Port 9000 / 9001
  # ──────────────────────────────────────────────
  filesystem:
    image: rustfs/rustfs:latest
    command: server /data --console-address ":9001"
    ports:
      - "${DOCKER_FILESYSTEM_PORT:-9000}:9000"
      - "${DOCKER_FILESYSTEM_PORT_UI:-9001}:9001"
    environment:
      <<: *rustfs-environment
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  filesystem-init:
    image: rustfs/rc:latest
    depends_on:
      filesystem:
        condition: service_healthy
    environment:
      <<: *rustfs-environment
    entrypoint: >
      /bin/sh -c "rc alias set local http://filesystem:9000
      $${RUSTFS_ACCESS_KEY} $${RUSTFS_SECRET_KEY};
      rc mb local/$${RUSTFS_BUCKET} --ignore-existing;
      rc anonymous set download local/$${RUSTFS_BUCKET};"

  # ──────────────────────────────────────────────
  # Dev Tools
  # ──────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: unique-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: Rootpassword
    ports:
      - "3001:80"
    networks:
      - unique

volumes:
  db-data:
  auth-keys:
  rustfs-data:

networks:
  unique:
    driver: bridge
