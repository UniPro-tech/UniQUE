##
## UniQUE Local Development Stack
## Usage: docker compose up --build
##

name: unique

services:
  # ──────────────────────────────────────────────
  # MySQL Database
  # ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: unique-db
    environment:
      MYSQL_ROOT_PASSWORD: Rootpassword
      MYSQL_DATABASE: devdb
      MYSQL_USER: api
      MYSQL_PASSWORD: NewPass123
    volumes:
      - db-data:/var/lib/mysql
      - ./UniQUE-DB/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-pRootpassword",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Database Migration (run-once)
  # ──────────────────────────────────────────────
  db-migrate:
    build:
      context: ./UniQUE-DB
      platforms:
        - linux/amd64
      dockerfile: Dockerfile.dev
    container_name: unique-db-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:Rootpassword@tcp(db:3306)/devdb?multiStatements=true"
      MAX_RETRIES: "60"
      SLEEP: "2"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Auth Server (OAuth2 / OpenID Connect)
  # Port 8000 → container 8080
  # ──────────────────────────────────────────────
  auth:
    build:
      context: ./UniQUE-Auth
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: unique-auth
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN: "root:Rootpassword@tcp(db:3306)/devdb?charset=utf8mb4&parseTime=True&loc=Local"
      CONFIG_APP_NAME: UniQUE
      CONFIG_FRONTEND_URL: "http://localhost:3000"
      CONFIG_ISSUER_URL: "http://localhost:8000"
      CONFIG_KEY_TYPE: RSA
      CONFIG_KEY_PUBLIC_PATH: /app/keys/public
      CONFIG_KEY_PRIVATE_PATH: /app/keys/private
      GIN_MODE: debug
      CONFIG_WEBAUTHN_RPID: "localhost"
      CONFIG_WEBAUTHN_RP_DISPLAY_NAME: "UniQUE Dev"
      CONFIG_WEBAUTHN_ORIGIN: "https://localhost:3000"
      CONFIG_WEBAUTHN_DEBUG: "true"
    volumes:
      - auth-keys:/app/keys
    ports:
      - "8000:8080"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Resource API Server
  # Port 8001 → container 8080
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./UniQUE-API
      dockerfile: ./Dockerfile
      platforms:
        - linux/amd64
    container_name: unique-api
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
    environment:
      DB_DSN: "root:Rootpassword@tcp(db:3306)/devdb?charset=utf8mb4&parseTime=True&loc=Local"
      CONFIG_APP_NAME: UniQUE
      CONFIG_FRONTEND_URL: "http://localhost:3000"
      CONFIG_ISSUER_URL: "http://localhost:8000"
      CONFIG_ISSUER_INTERNAL_URL: "http://auth:8080"
      CONFIG_EMAIL_SENDER_URL: "http://mailserver:8080"
      DISCORD_CLIENT_ID: "1437220613554176294"
      DISCORD_CLIENT_SECRET: "your-client-secret"
      DISCORD_GUILD_ID: "your-guild-id"
      DISCORD_BOT_TOKEN: "your-token-here"
      DISCORD_MEMBER_ROLE_ID: "your-member-role-id-here"
      GIN_MODE: debug
    ports:
      - "8001:8080"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Mail Server
  # Port 8002 → container 8080
  # ──────────────────────────────────────────────
  mailserver:
    build:
      context: ./UniQUE-MailServer
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: unique-mailserver
    environment:
      CONFIG_APP_NAME: UniQUE
      CONFIG_FRONTEND_URL: "http://localhost:3000"
      CONFIG_ISSUER_URL: "http://auth:8080"
      SMTP_HOST: unipro.sakura.ne.jp
      SMTP_PORT: "587"
      SMTP_USERNAME: "yuito@uniproject.jp"
      SMTP_PASSWORD: "ty_ttyy_11291129"
      SMTP_FROM: "yuito@uniproject.jp"
      SMTP_SECURE: "false"
      FROM_NAME: "デジタル創作サークルUniProject | UniQUE"
      COPYRIGHT_NAME: "All-Japan Digital Creative Club UniProject"
      GIN_MODE: debug
    ports:
      - "8002:8080"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Frontend (Next.js / Bun)
  # Port 3000
  # ──────────────────────────────────────────────
  front:
    build:
      context: ./UniQUE-Front
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: unique-front
    depends_on:
      auth:
        condition: service_started
      api:
        condition: service_started
    environment:
      AUTH_API_URL: "http://auth:8080"
      NEXT_PUBLIC_AUTH_API_URL: "http://localhost:8000"
      RESOURCE_API_URL: "http://api:8080"
      NEXT_PUBLIC_RESOURCE_API_URL: "http://localhost:8001"
      DISCORD_CLIENT_ID: ""
      DISCORD_CLIENT_SECRET: ""
      DISCORD_REDIRECT_URI: "http://localhost:3000/api/oauth/discord/callback"
      DISCORD_GUILD_ID: ""
      DISCORD_BOT_TOKEN: ""
      DISCORD_MEMBER_ROLE_ID: ""
      GAS_MIGRATE_API_URL: ""
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SECURE: "false"
      MAIL_USER: ""
      MAIL_PASS: ""
      MAIL_FROM_NAME: "UniQUE Dev"
      MAIL_FROM_EMAIL: "noreply@unique.local"
      MAIL_ENVELOPE_FROM: "noreply@unique.local"
      RESOURCE_API_KEY: "KE8B6ZXdVjMdsjRAmZu53EKa8UJ7MLcWBWerFREF"
    ports:
      - "3000:3000"
    networks:
      - unique

  # ──────────────────────────────────────────────
  # Dev Tools
  # ──────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: unique-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: Rootpassword
    ports:
      - "3001:80"
    networks:
      - unique

volumes:
  db-data:
  auth-keys:

networks:
  unique:
    driver: bridge
